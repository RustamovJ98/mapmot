name: Update map data

on:
  schedule:
    - cron: "0 1 * * 1"   # каждый понедельник 01:00 UTC (06:00 Ташкент)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh OSM data
        run: python build/fetch_osm.py --force

      - name: Build map
        run: python build/build_map.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Auto-update map data ($(date -u +%Y-%m-%d))"
          git push
